name: build-toolchain

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl bzip2 cpio rpm2cpio zstd

      - name: Install micromamba
        run: |
          mkdir -p "$RUNNER_TEMP/micromamba"
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest |
            tar -xj -C "$RUNNER_TEMP/micromamba" bin/micromamba
          sudo install -m 0755 "$RUNNER_TEMP/micromamba/bin/micromamba" /usr/local/bin/micromamba

      - name: Build toolchain
        run: ./scripts/build-toolchain.sh --force

      - name: Verify toolchain ABI
        run: ./scripts/verify-toolchain.sh

      - name: Package toolchain
        run: ./scripts/package-toolchain.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-rhel8-gcc-toolset12
          path: |
            dist/*.tar.zst
            dist/*.sha256

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
