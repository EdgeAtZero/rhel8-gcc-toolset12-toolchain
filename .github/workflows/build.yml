name: build-toolchain

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache source packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rhel8-gcc-toolset12-toolchain
          key: rhel8-toolchain-inputs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('manifests/toolchain.json', 'manifests/conda-linux-64.lock') }}
          restore-keys: |
            rhel8-toolchain-inputs-${{ runner.os }}-${{ runner.arch }}-

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl cpio rpm2cpio zstd

      - name: Install pinned micromamba
        run: |
          mkdir -p "$RUNNER_TEMP/toolchain-bin"
          ./scripts/install-micromamba.sh --destination "$RUNNER_TEMP/toolchain-bin/micromamba"
          echo "$RUNNER_TEMP/toolchain-bin" >> "$GITHUB_PATH"

      - name: Build toolchain
        run: ./scripts/build-toolchain.sh --force

      - name: Verify toolchain ABI
        run: ./scripts/verify-toolchain.sh

      - name: Package toolchain
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: ./scripts/package-toolchain.sh

      - name: Recheck archive checksum
        run: |
          cd dist
          sha256sum -c linux-x86_64-rhel8-gcc-toolset12.tar.zst.sha256
          sha256sum -c SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x86_64-rhel8-gcc-toolset12
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download built release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x86_64-rhel8-gcc-toolset12
          path: dist

      - name: Verify release checksums
        run: |
          cd dist
          sha256sum -c linux-x86_64-rhel8-gcc-toolset12.tar.zst.sha256
          sha256sum -c SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/linux-x86_64-rhel8-gcc-toolset12.tar.zst

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/linux-x86_64-rhel8-gcc-toolset12.tar.zst
          sbom-path: dist/linux-x86_64-rhel8-gcc-toolset12.spdx.json

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
