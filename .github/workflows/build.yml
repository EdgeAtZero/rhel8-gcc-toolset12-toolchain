name: build-toolchain

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify metadata consistency
        run: ./scripts/verify-metadata-consistency.py

      - name: Cache upstream packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/rhel8-gcc-toolset12-toolchain
            ~/.local/share/mamba/pkgs
          key: rhel8-toolchain-inputs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('manifests/toolchain.json', 'manifests/conda-linux-64.lock') }}
          restore-keys: |
            rhel8-toolchain-inputs-${{ runner.os }}-${{ runner.arch }}-

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl cpio rpm2cpio zstd

      - name: Install pinned micromamba
        run: |
          mkdir -p "$RUNNER_TEMP/toolchain-bin"
          ./scripts/install-micromamba.sh --destination "$RUNNER_TEMP/toolchain-bin/micromamba"
          echo "$RUNNER_TEMP/toolchain-bin" >> "$GITHUB_PATH"

      - name: Build toolchain
        run: ./scripts/build-toolchain.sh --force

      - name: Verify toolchain ABI
        run: ./scripts/verify-toolchain.sh

      - name: Run probes on AlmaLinux 8
        run: ./scripts/verify-runtime-almalinux8.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '.')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create or update source-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ -f "$notes" ]]; then
              gh release edit "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$GITHUB_REF_NAME" \
                --notes-file "$notes"
            fi
          elif [[ -f "$notes" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --generate-notes
          fi
