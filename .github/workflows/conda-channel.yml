name: conda-channel

on:
  push:
    branches: [main]
    paths:
      - 'conda/**'
      - 'manifests/**'
      - 'scripts/**'
      - 'README.md'
      - 'THIRD_PARTY.md'
      - '.github/workflows/conda-channel.yml'
  pull_request:
    paths:
      - 'conda/**'
      - 'manifests/**'
      - 'scripts/**'
      - 'README.md'
      - 'THIRD_PARTY.md'
      - '.github/workflows/conda-channel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache channel inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rhel8-gcc-toolset12-toolchain
          key: rhel8-conda-channel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('manifests/toolchain.json', 'manifests/conda-linux-64.lock', 'conda/**', 'scripts/build-conda-channel.sh', 'scripts/prepare-conda-sources.sh') }}
          restore-keys: |
            rhel8-conda-channel-${{ runner.os }}-${{ runner.arch }}-

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl cpio rpm2cpio

      - name: Install pinned micromamba
        run: |
          mkdir -p "$RUNNER_TEMP/toolchain-bin"
          ./scripts/install-micromamba.sh --destination "$RUNNER_TEMP/toolchain-bin/micromamba"
          echo "$RUNNER_TEMP/toolchain-bin" >> "$GITHUB_PATH"

      - name: Build and validate channel
        env:
          CHANNEL_DIR: ${{ runner.temp }}/conda-channel
        run: ./scripts/build-conda-channel.sh

      - name: Verify channel artifact inventory
        env:
          CHANNEL_DIR: ${{ runner.temp }}/conda-channel
        run: |
          test "$(find "$CHANNEL_DIR/linux-64" -maxdepth 1 -type f -name '*.conda' | wc -l)" -eq 3
          test "$(find "$CHANNEL_DIR/sources" -maxdepth 1 -type f -name '*.src.rpm' | wc -l)" -eq 2
          test -f "$CHANNEL_DIR/linux-64/repodata.json"
          test -f "$CHANNEL_DIR/noarch/repodata.json"
          test -f "$CHANNEL_DIR/sources/SOURCE-METADATA.json"
          test -f "$CHANNEL_DIR/sources/SHA256SUMS"

      - name: Upload validated channel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conda-channel-${{ github.sha }}
          path: ${{ runner.temp }}/conda-channel
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    concurrency:
      group: conda-channel-pages
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download validated channel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: conda-channel-${{ github.sha }}
          path: ${{ runner.temp }}/site/conda

      - name: Prepare Pages snapshot
        env:
          SITE_DIR: ${{ runner.temp }}/site
        run: |
          set -euo pipefail

          touch "$SITE_DIR/.nojekyll"
          cat >"$SITE_DIR/index.html" <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <title>RHEL 8 GCC Toolset 12 conda channel</title>
          <h1>RHEL 8 GCC Toolset 12 conda channel</h1>
          <p>Generated from <code>$GITHUB_SHA</code>.</p>
          <p>Channel URL: <code>https://edgeatzero.github.io/rhel8-gcc-toolset12-toolchain/conda</code></p>
          <pre>micromamba create -y \
            -n rhel8-gcc-toolset12 \
            --override-channels \
            -c https://edgeatzero.github.io/rhel8-gcc-toolset12-toolchain/conda \
            -c conda-forge \
            --strict-channel-priority \
            rhel8-gcc-toolset12-toolchain=1.0.0</pre>
          EOF

          printf '%s\n' "$GITHUB_SHA" >"$SITE_DIR/SOURCE-COMMIT"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
          include-hidden-files: true

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
