name: deploy-v1.0.1-channel-recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v1.0.1-channel-recovery.yml'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    concurrency:
      group: conda-channel-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download validated v1.0.1 channel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: conda-channel-a15e618246e3f64ff3a74f4bfa6a710c8d189d32
          path: ${{ runner.temp }}/site/conda
          github-token: ${{ github.token }}
          run-id: '36556979939'

      - name: Prepare Pages snapshot
        env:
          SITE_DIR: ${{ runner.temp }}/site
          SOURCE_SHA: a15e618246e3f64ff3a74f4bfa6a710c8d189d32
          SOURCE_TAG: v1.0.1
        run: |
          set -euo pipefail
          version="${SOURCE_TAG#v}"

          touch "$SITE_DIR/.nojekyll"
          cat >"$SITE_DIR/index.html" <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <title>RHEL 8 GCC Toolset 12 conda channel</title>
          <h1>RHEL 8 GCC Toolset 12 conda channel</h1>
          <p>Published from immutable tag <code>$SOURCE_TAG</code> at <code>$SOURCE_SHA</code>.</p>
          <p>Channel URL: <code>https://edgeatzero.github.io/rhel8-gcc-toolset12-toolchain/conda</code></p>
          <pre>micromamba create -y \
            -n rhel8-gcc-toolset12 \
            --override-channels \
            -c https://edgeatzero.github.io/rhel8-gcc-toolset12-toolchain/conda \
            -c conda-forge \
            --strict-channel-priority \
            rhel8-gcc-toolset12-toolchain=$version</pre>
          EOF

          printf '%s\n' "$SOURCE_SHA" >"$SITE_DIR/SOURCE-COMMIT"
          printf '%s\n' "$SOURCE_TAG" >"$SITE_DIR/SOURCE-TAG"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
          include-hidden-files: true

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
