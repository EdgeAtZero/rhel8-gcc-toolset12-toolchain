schema_version: 1

context:
  version: "1.0.0"

package:
  name: rhel8-gcc-toolset12-toolchain
  version: ${{ version }}

build:
  number: 0
  script:
    - mkdir -p "$PREFIX/share/rhel8-gcc-toolset12"
    - printf '%s\n' "RHEL 8 GCC Toolset 12 compatibility toolchain meta package" > "$PREFIX/share/rhel8-gcc-toolset12/toolchain.txt"

requirements:
  run:
    - _openmp_mutex ==4.5 20_gnu
    - binutils_impl_linux-64 ==2.39 he00db2b_1
    - binutils_linux-64 ==2.39 h5fc0e48_13
    - gcc_impl_linux-64 ==12.2.0 hcc96c02_19
    - gcc_linux-64 ==12.2.0 h4798a0e_13
    - gxx_impl_linux-64 ==12.2.0 hcc96c02_19
    - gxx_linux-64 ==12.2.0 hb41e900_13
    - kernel-headers_linux-64 ==4.18.0 he073ed8_9
    - ld_impl_linux-64 ==2.39 hcc3a1bd_1
    - libgcc ==16.2.0 ha9f2e26_7
    - libgcc-devel_linux-64 ==12.2.0 h3b97bd3_19
    - libgcc-ng ==16.2.0 h69a702a_7
    - libgomp ==16.2.0 he0feb66_7
    - libsanitizer ==12.2.0 h46fd767_19
    - libstdcxx ==16.2.0 h934c35e_7
    - libstdcxx-devel_linux-64 ==12.2.0 h3b97bd3_19
    - libstdcxx-ng ==16.2.0 hdf11a46_7
    - sysroot_linux-64 ==2.28 h4ee821c_9
    - tzdata ==2026c h151e31d_0
    - rhel8-gcc-toolset12-activate ==1.0.0
    - rhel8-gcc-toolset12-compat ==1.0.0

tests:
  - script:
      - test -f "$PREFIX/share/rhel8-gcc-toolset12/toolchain.txt"

about:
  homepage: https://github.com/EdgeAtZero/rhel8-gcc-toolset12-toolchain
  repository: https://github.com/EdgeAtZero/rhel8-gcc-toolset12-toolchain
  license: MIT
  summary: Tested package set for the RHEL 8 GCC Toolset 12 compatibility toolchain
