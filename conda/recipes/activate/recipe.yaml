schema_version: 1

context:
  version: "1.0.0"

package:
  name: rhel8-gcc-toolset12-activate
  version: ${{ version }}

build:
  number: 1
  script: build.sh

requirements:
  build:
    - python 3.13.*
  host:
    - gcc_impl_linux-64 ==12.4.0 h26ba24d_2
  run:
    - gcc_linux-64 ==12.4.0 h6b7512a_10
    - gxx_linux-64 ==12.4.0 h8489865_10
    - binutils_linux-64 ==2.46.1 default_h4852527_102
    - sysroot_linux-64 ==2.28 h4ee821c_9
    - rhel8-gcc-toolset12-compat ==1.0.0

tests:
  - script:
      - test -x "$PREFIX/libexec/rhel8-gcc-toolset12/bin/x86_64-conda-linux-gnu-gcc"
      - test -x "$PREFIX/libexec/rhel8-gcc-toolset12/bin/x86_64-conda-linux-gnu-g++"
      - test "$(readlink "$PREFIX/libexec/rhel8-gcc-toolset12/bin/gcc")" = "x86_64-conda-linux-gnu-gcc"
      - test "$(readlink "$PREFIX/libexec/rhel8-gcc-toolset12/bin/g++")" = "x86_64-conda-linux-gnu-g++"
      - test -f "$PREFIX/share/rhel8-gcc-toolset12/link.specs"

about:
  homepage: https://github.com/EdgeAtZero/rhel8-gcc-toolset12-toolchain
  repository: https://github.com/EdgeAtZero/rhel8-gcc-toolset12-toolchain
  license: MIT
  summary: Wrapper and activation layer for the RHEL 8 GCC Toolset 12 toolchain
