name: Setup RHEL 8 GCC Toolset 12 toolchain
description: Build and configure the pinned RHEL 8 ABI / GCC Toolset 12 Linux x86_64 toolchain on the runner.

inputs:
  verify:
    description: Run the toolchain ABI verification probe after assembly.
    required: false
    default: 'true'

outputs:
  prefix:
    description: Installed toolchain prefix.
    value: ${{ steps.setup.outputs.prefix }}
  version:
    description: Action ref used to assemble the toolchain.
    value: ${{ steps.setup.outputs.version }}
  identity:
    description: Stable manifest/lock-derived toolchain identity suitable for build cache keys.
    value: ${{ steps.setup.outputs.identity }}

runs:
  using: composite
  steps:
    - name: Assemble and configure toolchain
      id: setup
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail

        name="linux-x86_64-rhel8-gcc-toolset12"
        prefix="/opt/toolchains/${name}"
        action_path="${{ github.action_path }}"

        case "$(uname -s)/$(uname -m)" in
          Linux/x86_64) ;;
          *)
            echo "This action supports only Linux x86_64 runners." >&2
            exit 1
            ;;
        esac

        SUDO=()
        if ((EUID != 0)); then
          command -v sudo >/dev/null 2>&1 || {
            echo "sudo is required to install under /opt/toolchains." >&2
            exit 1
          }
          SUDO=(sudo)
        fi

        missing=()
        for command in curl cpio rpm2cpio zstd sha256sum python3; do
          command -v "${command}" >/dev/null 2>&1 || missing+=("${command}")
        done

        if (("${#missing[@]}" > 0)); then
          if command -v apt-get >/dev/null 2>&1; then
            "${SUDO[@]}" apt-get update
            "${SUDO[@]}" apt-get install -y --no-install-recommends curl cpio rpm2cpio zstd python3 coreutils
          else
            printf 'Missing required host commands: %s\n' "${missing[*]}" >&2
            echo "Automatic installation currently supports apt-get based runners only." >&2
            exit 1
          fi
        fi

        tool_bin="${RUNNER_TEMP:-/tmp}/rhel8-gcc-toolset12-bin"
        mkdir -p "${tool_bin}"
        "${action_path}/scripts/install-micromamba.sh" \
          --destination "${tool_bin}/micromamba"
        export PATH="${tool_bin}:${PATH}"

        "${action_path}/scripts/build-toolchain.sh" --force

        echo "${prefix}/bin" >> "${GITHUB_PATH}"
        {
          echo "CC=${prefix}/bin/cc"
          echo "CXX=${prefix}/bin/c++"
          echo "CPP=${prefix}/bin/cpp"
          echo "GCC=${prefix}/bin/gcc"
          echo "GXX=${prefix}/bin/g++"
          echo "AR=${prefix}/bin/ar"
          echo "AS=${prefix}/bin/as"
          echo "LD=${prefix}/bin/ld"
          echo "NM=${prefix}/bin/nm"
          echo "OBJCOPY=${prefix}/bin/objcopy"
          echo "OBJDUMP=${prefix}/bin/objdump"
          echo "RANLIB=${prefix}/bin/ranlib"
          echo "READELF=${prefix}/bin/readelf"
          echo "STRINGS=${prefix}/bin/strings"
          echo "STRIP=${prefix}/bin/strip"
          echo "ADDR2LINE=${prefix}/bin/addr2line"
          echo "CXXFILT=${prefix}/bin/c++filt"
          echo "ELFEDIT=${prefix}/bin/elfedit"
          echo "SIZE=${prefix}/bin/size"
          echo "GPROF=${prefix}/bin/gprof"
        } >> "${GITHUB_ENV}"

        identity_hash="$(
          sha256sum \
            "${action_path}/manifests/toolchain.json" \
            "${action_path}/manifests/conda-linux-64.lock" |
            sha256sum |
            awk '{print $1}'
        )"
        version="${ACTION_REF:-source}"

        echo "prefix=${prefix}" >> "${GITHUB_OUTPUT}"
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
        echo "identity=${name}-${identity_hash:0:16}" >> "${GITHUB_OUTPUT}"

        "${prefix}/bin/gcc" --version | head -n 1
        echo "Toolchain: ${name}"
        echo "Source ref: ${version}"
        echo "Prefix: ${prefix}"

    - name: Verify toolchain ABI
      if: inputs.verify == 'true'
      shell: bash
      env:
        PREFIX: ${{ steps.setup.outputs.prefix }}
      run: |
        set -euo pipefail
        "${{ github.action_path }}/scripts/verify-toolchain.sh"

branding:
  icon: tool
  color: red
