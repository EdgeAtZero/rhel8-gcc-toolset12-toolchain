name: Setup RHEL 8 GCC Toolset 12 toolchain
description: Build and configure the pinned RHEL 8 ABI / GCC Toolset 12 Linux x86_64 toolchain on the runner.

inputs:
  verify:
    description: Run the toolchain ABI verification probe after assembly.
    required: false
    default: 'true'

outputs:
  prefix:
    description: Installed toolchain prefix.
    value: ${{ steps.setup.outputs.prefix }}
  version:
    description: Action ref used to assemble the toolchain.
    value: ${{ steps.setup.outputs.version }}
  identity:
    description: Stable manifest/lock-derived toolchain identity suitable for build cache keys.
    value: ${{ steps.setup.outputs.identity }}

runs:
  using: composite
  steps:
    - name: Assemble and configure toolchain
      id: setup
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail

        name="linux-x86_64-rhel8-gcc-toolset12"
        action_path="${{ github.action_path }}"
        environment_name="$(
          python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["environment_name"])' \
            "${action_path}/manifests/toolchain.json"
        )"

        case "$(uname -s)/$(uname -m)" in
          Linux/x86_64) ;;
          *)
            echo "This action supports only Linux x86_64 runners." >&2
            exit 1
            ;;
        esac

        missing=()
        for command in curl cpio rpm2cpio zstd sha256sum python3; do
          command -v "${command}" >/dev/null 2>&1 || missing+=("${command}")
        done

        if (("${#missing[@]}" > 0)); then
          if command -v apt-get >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends curl cpio rpm2cpio zstd python3 coreutils
          else
            printf 'Missing required host commands: %s\n' "${missing[*]}" >&2
            echo "Automatic installation currently supports sudo + apt-get runners only." >&2
            exit 1
          fi
        fi

        tool_bin="${RUNNER_TEMP:-/tmp}/rhel8-gcc-toolset12-bin"
        mkdir -p "${tool_bin}"
        "${action_path}/scripts/install-micromamba.sh" \
          --destination "${tool_bin}/micromamba"
        export PATH="${tool_bin}:${PATH}"

        "${action_path}/scripts/build-toolchain.sh" --force
        prefix="$("${action_path}/scripts/resolve-toolchain-prefix.sh")"

        if [[ -z "${MAMBA_ROOT_PREFIX:-}" ]]; then
          export MAMBA_ROOT_PREFIX="$(
            micromamba info --json |
              python3 -c 'import json, sys; print(json.load(sys.stdin)["base environment"])'
          )"
        fi
        set +u
        eval "$(micromamba shell hook --shell bash)"
        micromamba activate "${environment_name}"
        set -u

        printf '%s\n' "${prefix}/bin" >> "${GITHUB_PATH}"

        activated_vars=(
          CONDA_PREFIX CONDA_DEFAULT_ENV CONDA_SHLVL
          CONDA_TOOLCHAIN_HOST CONDA_TOOLCHAIN_BUILD CONDA_BUILD_SYSROOT
          HOST BUILD
          CC CXX CPP GCC GXX CC_FOR_BUILD CXX_FOR_BUILD
          AR AS LD NM OBJCOPY OBJDUMP RANLIB READELF STRINGS STRIP
          ADDR2LINE CXXFILT ELFEDIT SIZE GPROF
          CFLAGS CXXFLAGS CPPFLAGS LDFLAGS
          DEBUG_CFLAGS DEBUG_CXXFLAGS DEBUG_CPPFLAGS
          CMAKE_PREFIX_PATH CMAKE_ARGS MESON_ARGS
        )
        for variable in "${activated_vars[@]}"; do
          if [[ -v "$variable" ]]; then
            printf '%s=%s\n' "$variable" "${!variable}" >> "${GITHUB_ENV}"
          fi
        done

        identity_hash="$(
          sha256sum \
            "${action_path}/manifests/toolchain.json" \
            "${action_path}/manifests/conda-linux-64.lock" |
            sha256sum |
            awk '{print $1}'
        )"
        version="${ACTION_REF:-source}"

        echo "prefix=${prefix}" >> "${GITHUB_OUTPUT}"
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
        echo "identity=${name}-${identity_hash:0:16}" >> "${GITHUB_OUTPUT}"

        "$CC" --version | head -n 1
        echo "Toolchain: ${name}"
        echo "Source ref: ${version}"
        echo "Environment: ${environment_name}"
        echo "Prefix: ${prefix}"

    - name: Verify toolchain ABI
      if: inputs.verify == 'true'
      shell: bash
      env:
        PREFIX: ${{ steps.setup.outputs.prefix }}
      run: |
        set -euo pipefail
        "${{ github.action_path }}/scripts/verify-toolchain.sh"

branding:
  icon: tool
  color: red
